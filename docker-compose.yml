services:
  postgres:
    image: postgres:16-alpine
    container_name: ptit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ptit_web_tool}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ptit_web_tool}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ptit-web-tool:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ptit-web-tool
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Asia/Ho_Chi_Minh
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ptit_web_tool}?schema=public
    volumes:
      # Mount thư mục backups để lưu và quản lý các file sao lưu bên ngoài container
      - ./backups:/app/backups

volumes:
  postgres_data:
    driver: local
